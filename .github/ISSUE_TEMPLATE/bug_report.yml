name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. In a git project, ask Claude to ...
        2. Run /tm undo
        3. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output of the /tm command, or `/tm log`. Remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: Time machine version
      placeholder: 0.5.0
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: '`claude --version`'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Other]
    validations:
      required: true
