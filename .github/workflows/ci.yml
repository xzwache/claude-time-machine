name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The mod API is early access: pin the Claude Code build it is developed against.
      - run: npm install -g @anthropic-ai/claude-code@2.1.287
      - name: Format
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Validate plugin and marketplace
        run: npm run validate
      - name: Mod tests
        run: npm run test:mod
      # Loading the mod lays .claude-plugin/types for the typecheck. A /tm
      # command is answered by the mod itself, so this needs no credentials.
      - name: Typecheck
        run: npm run types && npm run typecheck
      - name: Versions agree
        run: node scripts/check-version.ts
